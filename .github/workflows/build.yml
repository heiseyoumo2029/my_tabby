name: Build Windows and macOS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tmux-compat:
    name: tmux compatibility (${{ matrix.version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ['3.0a', '3.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build tmux and install test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libevent-dev libncurses-dev pkg-config openssh-server
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/tmux.tar.gz" "https://github.com/tmux/tmux/releases/download/${{ matrix.version }}/tmux-${{ matrix.version }}.tar.gz"
          tar -xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/tmux-${{ matrix.version }}"
          ./configure --prefix="$RUNNER_TEMP/tmux-install"
          make -j2
          make install
          npm install --prefix "$RUNNER_TEMP/tmux-test" --no-save --no-package-lock typescript@5.2.2 shell-quote@1.7.4 russh@0.1.37 rxjs@7
          echo "$RUNNER_TEMP/tmux-install/bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$RUNNER_TEMP/tmux-test/node_modules" >> "$GITHUB_ENV"
          echo "TMUX_BINARY=$RUNNER_TEMP/tmux-install/bin/tmux" >> "$GITHUB_ENV"
      - name: Verify pane discovery and directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tmux-env" "$RUNNER_TEMP/test-ssh"
          chmod 700 "$RUNNER_TEMP/tmux-env"
          chmod 755 "$RUNNER_TEMP/test-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/test-ssh/host"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/test-ssh/client"
          cp "$RUNNER_TEMP/test-ssh/client.pub" "$RUNNER_TEMP/test-ssh/authorized_keys"
          cat > "$RUNNER_TEMP/test-ssh/sshd_config" <<CONFIG
          Port 39278
          ListenAddress 127.0.0.1
          HostKey $RUNNER_TEMP/test-ssh/host
          PidFile $RUNNER_TEMP/test-ssh/sshd.pid
          AuthorizedKeysFile $RUNNER_TEMP/test-ssh/authorized_keys
          StrictModes no
          UsePAM no
          PasswordAuthentication no
          PubkeyAuthentication yes
          SetEnv TMUX_TMPDIR=$RUNNER_TEMP/tmux-env PATH=$RUNNER_TEMP/tmux-install/bin:/usr/bin:/bin
          CONFIG
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -e -f "$RUNNER_TEMP/test-ssh/sshd_config" > "$RUNNER_TEMP/test-ssh/log" 2>&1 &
          sshd_pid=$!
          trap 'sudo kill "$sshd_pid" 2>/dev/null || true' EXIT
          sleep 2
          if ! kill -0 "$sshd_pid" 2>/dev/null; then cat "$RUNNER_TEMP/test-ssh/log"; exit 1; fi
          node tabby-ssh/test/tmuxVersion.integration.cjs
        env:
          EXPECT_TMUX_VERSION: ${{ matrix.version }}
          TMUX_TMPDIR: ${{ runner.temp }}/tmux-env
          TEST_SSH_PORT: '39278'
          TEST_SSH_KEY: ${{ runner.temp }}/test-ssh/client

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-apple-darwin
          - arch: arm64
            rust_target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchains and dependencies
        run: |
          rustup target add "${{ matrix.rust_target }}"
          npm install --global yarn
          yarn --network-timeout 1000000
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET_TRIPLE: ${{ matrix.rust_target }}

      - name: Build application
        run: |
          node tabby-ssh/test/tabTransfer.test.cjs
          node tabby-ssh/test/tmuxQuery.test.cjs
          node tabby-ssh/test/sshControls.test.cjs
          node tabby-ssh/test/reconnectAll.test.cjs
          yarn run build
          node scripts/prepackage-plugins.mjs
          sed -i '' 's/updateInfo = await/\/\/updateInfo = await/g' node_modules/app-builder-lib/out/targets/ArchiveTarget.js
          ln -s ../../node_modules/electron app/node_modules/electron
          node scripts/build-macos.mjs
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET_TRIPLE: ${{ matrix.rust_target }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchains
        shell: pwsh
        run: |
          rustup target add "${{ matrix.rust_target }}"
          npm install --global yarn node-gyp@10.2.0
          $prefix = npm prefix -g
          $nodeGyp = Join-Path $prefix "node_modules\node-gyp\bin\node-gyp.js"
          "npm_config_node_gyp=$nodeGyp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Visual C++ Redistributable
        shell: bash
        run: |
          if [ "$ARCH" = "arm64" ]; then
            curl -sSL -o build/vc_redist.exe "https://aka.ms/vs/17/release/vc_redist.arm64.exe"
          else
            curl -sSL -o build/vc_redist.exe "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          fi
        env:
          ARCH: ${{ matrix.arch }}

      - name: Install dependencies and build application
        shell: pwsh
        run: |
          yarn --network-timeout 1000000
          node tabby-ssh/test/tabTransfer.test.cjs
          node tabby-ssh/test/tmuxQuery.test.cjs
          node tabby-ssh/test/sshControls.test.cjs
          node tabby-ssh/test/reconnectAll.test.cjs
          yarn run build
          node scripts/prepackage-plugins.mjs
          node scripts/build-windows.mjs
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET_TRIPLE: ${{ matrix.rust_target }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Add Visual C++ runtime to portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path vc-runtime -Force | Out-Null
          $runtimeArch = if ("${{ matrix.arch }}" -eq "x64") { "x64" } else { "arm64" }
          $crt = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\$runtimeArch\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) {
            @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") | ForEach-Object {
              $source = Join-Path $crt.FullName $_
              if (Test-Path $source) { Copy-Item $source vc-runtime/ }
            }
          }

          $portable = Get-ChildItem dist/*-portable-*.zip | Select-Object -First 1
          if ($portable) {
            Add-Type -AssemblyName System.IO.Compression
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::Open($portable.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
            Get-ChildItem vc-runtime -Filter *.dll | ForEach-Object {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $_.FullName, $_.Name) | Out-Null
            }
            $zip.Dispose()
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.arch }}
          path: |
            dist/*-setup-*.exe
            dist/*-portable-*.zip
          if-no-files-found: error

  release:
    name: Publish release packages
    runs-on: ubuntu-24.04
    needs:
      - tmux-compat
      - macos
      - windows

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
